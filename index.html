<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>vBTC — Бонусы и награды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Очистить URL от Telegram hash-параметров ДО загрузки TADS SDK
        if (window.location.hash && window.location.hash.indexOf('tgWebApp') !== -1) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
        }
    </script>
    <script src="https://w.tads.me/widget.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #0f0f0f);
            color: var(--tg-theme-text-color, #fff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header { text-align: center; margin-bottom: 20px; width: 100%; }
        .coin-balance {
            font-size: 48px; font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin: 8px 0;
        }
        .coin-label { font-size: 14px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
        .bonus-badge { font-size: 18px; font-weight: 600; color: #ffd700; margin: 8px 0; }
        .section { width: 100%; max-width: 500px; margin: 14px 0; }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 10px; opacity: 0.9; }
        .tads-container { width: 100%; min-height: 100px; border-radius: 12px; overflow: hidden; }
        .tads-container > * { width: 100% !important; max-width: 100% !important; }
        .tads-container img { max-width: 100% !important; height: auto !important; border-radius: 8px; }
        .tads-container iframe { width: 100% !important; max-width: 100% !important; border: none; }
        .btn {
            width: 100%; max-width: 500px; padding: 16px; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 600; cursor: pointer; margin: 6px 0;
            transition: opacity 0.2s; display: block; text-align: center;
        }
        .btn:active { opacity: 0.7; }
        .btn-primary { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
        .btn-reward {
            background: linear-gradient(135deg, #ffd700, #ff9500); color: #000;
            font-size: 18px; font-weight: 700; box-shadow: 0 4px 16px rgba(255,215,0,0.3);
        }
        .btn-claim {
            background: linear-gradient(135deg, #00e676, #00c853); color: #000;
            font-size: 18px; font-weight: 700; box-shadow: 0 4px 16px rgba(0,230,118,0.3);
        }
        .btn-dim { background: #2a2a2a; color: #888; }
        .status-text { font-size: 14px; opacity: 0.6; text-align: center; margin: 10px 0; min-height: 20px; }
        .reward-toast {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%,-50%) scale(0);
            background: linear-gradient(135deg,#ffd700,#ff9500); color:#000;
            padding: 24px 40px; border-radius: 20px; font-size: 24px; font-weight: 700;
            box-shadow: 0 8px 32px rgba(255,215,0,0.4); z-index: 9999;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
        }
        .reward-toast.show { transform: translate(-50%,-50%) scale(1); }
        .info-card {
            background: var(--tg-theme-secondary-bg-color,#1a1a1a); border-radius: 12px;
            padding: 16px; width: 100%; max-width: 500px; margin: 8px 0;
            font-size: 13px; line-height: 1.6; opacity: 0.85;
        }
        .info-card b { color: #ffd700; }
        .tads-fullscreen-overlay {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            z-index: 10000; display: none; background: #000;
        }
        .tads-fullscreen-overlay.active { display: flex; align-items: center; justify-content: center; }
        .tads-fullscreen-overlay iframe, .tads-fullscreen-overlay div, .tads-fullscreen-overlay img {
            max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="header">
        <div class="coin-label" id="headerLabel">₿ vBTC — Бонусы</div>
        <div class="coin-balance" id="coinBalance">🎁</div>
        <div class="bonus-badge" id="bonusBadge" style="display:none"></div>
    </div>

    <div class="info-card" id="infoCard">
        Выберите бонус → посмотрите рекламу → заберите награду.<br>
        <span style="opacity:0.5;font-size:11px">ver.2.0.0</span>
    </div>

    <!-- ══ ГЛАВНАЯ: выбор бонуса (без рекламной вставки) ══ -->
    <div class="section" id="bonusSelectSection">
        <div class="section-title">🎁 Бонусы за просмотр рекламы</div>
        <button class="btn btn-primary" data-bonus="double_mining">⛏️ Удвоенный майнинг x1.5</button>
        <button class="btn btn-primary" data-bonus="power_boost">⚡ Буст мощности (15 мин)</button>
        <button class="btn btn-primary" data-bonus="extra_activations">➕ Доп. активация майнинга</button>
        <button class="btn btn-primary" data-bonus="rub_gift">💰 +25 ₽ на баланс</button>
        <button class="btn btn-primary" data-bonus="elec_free">🛡️ Без электричества (24 ч)</button>
    </div>

    <!-- ══ Центр наград (deep links в бота) ══ -->
    <div class="section" id="rewardsSection">
        <div class="section-title">🏅 Центр наград</div>
        <button class="btn btn-reward" id="dailyBtn">📅 Ежедневная награда</button>
        <button class="btn btn-reward" id="weeklyBtn">📆 Еженедельная награда</button>
        <div class="status-text">Награды начисляются в боте</div>
    </div>

    <!-- ══ Экран просмотра рекламы (режим бонуса) ══ -->
    <div class="section hidden" id="adWatchSection">
        <div class="section-title">📺 Шаг 2 — посмотрите рекламу</div>
        <div id="tgbSlot"></div>
        <div class="status-text" id="tgbStatus"></div>
        <button class="btn btn-reward" id="fullscreenBtn">🎬 Смотреть рекламу</button>
        <div class="status-text" id="fullscreenStatus"></div>
        <div class="status-text" style="opacity:0.45;font-size:12px">
            Бонус выдаётся только за полный просмотр рекламы
        </div>
    </div>

    <!-- ══ Экран коинов (?coins=1 — старый режим) ══ -->
    <div class="section hidden" id="coinsSection">
        <div class="section-title">📺 Реклама — кликни и получи коины</div>
        <div id="coinsTgbSlot"></div>
        <div class="status-text" id="coinsTgbStatus"></div>
        <button class="btn btn-reward" id="coinsFsBtn">🎬 Смотреть рекламу (+25 коинов)</button>
        <div class="status-text" id="coinsFsStatus"></div>
    </div>

    <!-- ══ Кнопка забрать (появляется после засчитанного просмотра) ══ -->
    <div class="section" id="claimSection" style="display:none">
        <button class="btn btn-claim" id="claimBtn">🎁 Забрать бонус</button>
    </div>

    <!-- Кнопка "назад к бонусам" в режиме просмотра -->
    <div class="section hidden" id="backToBonusSection">
        <button class="btn btn-dim" id="backToBonusBtn">⬅️ Выбрать другой бонус</button>
    </div>

    <div class="tads-fullscreen-overlay" id="fullscreen-ad-container"></div>
    <div class="reward-toast" id="rewardToast">+N</div>

    <script>
    (function() {
        // === CONFIG ===
        const TGB_WIDGET_ID = 11464;
        const FULLSCREEN_WIDGET_ID = 11466;
        const BOT_USERNAME = 'MusorkaBMB_bot';
        const COIN_PER_TGB_CLICK = 5;
        const COIN_PER_FULLSCREEN = 25;

        const VBTC_BONUS_LABELS = {
            'double_mining': '⛏️ Удвоенный майнинг x1.5',
            'power_boost': '⚡ Буст мощности',
            'extra_activations': '➕ Доп. активация майнинга',
            'rub_gift': '💰 +25 ₽ на баланс',
            'elec_free': '🛡️ Без электричества (24 ч)'
        };

        // === Telegram WebApp init ===
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) { tg.ready(); tg.expand(); tg.setBackgroundColor && tg.setBackgroundColor('#0f0f0f'); }
        const user = tg ? tg.initDataUnsafe : null;
        const startParam = user ? (user.start_param || '') : '';

        // === Режимы ===
        const urlParams = new URLSearchParams(window.location.search);
        const vbtcBonus = urlParams.get('vbtc_bonus') || '';
        const isCoinsMode = urlParams.get('coins') === '1' || (startParam && startParam.startsWith('balance_'));
        const isVbtcMode = vbtcBonus && VBTC_BONUS_LABELS.hasOwnProperty(vbtcBonus);

        let pendingReward = 0;
        let adWatched = false;          // только полный просмотр fullscreen открывает клейм

        function el(id) { return document.getElementById(id); }
        function show(id, v) { const e = el(id); if (e) e.style.display = v ? 'block' : 'none'; e && e.classList.toggle('hidden', !v); }
        function setTxt(id, t) { const e = el(id); if (e) e.textContent = t; }
        function toast(t) {
            const x = el('rewardToast'); x.textContent = t;
            x.classList.add('show'); setTimeout(() => x.classList.remove('show'), 2000);
        }
        function openTg(url) { if (tg) tg.openTelegramLink(url); else window.open(url, '_blank'); }

        // ══ РЕЖИМ 1: главная — выбор бонуса ══
        if (!isVbtcMode && !isCoinsMode) {
            show('bonusSelectSection', true);
            show('rewardsSection', true);
            document.querySelectorAll('#bonusSelectSection [data-bonus]').forEach(function(b) {
                b.addEventListener('click', function() {
                    window.location.search = '?vbtc_bonus=' + b.getAttribute('data-bonus');
                });
            });
            el('dailyBtn').addEventListener('click', function() {
                openTg('https://t.me/' + BOT_USERNAME + '?start=vbtc_daily');
            });
            el('weeklyBtn').addEventListener('click', function() {
                openTg('https://t.me/' + BOT_USERNAME + '?start=vbtc_weekly');
            });
            return; // реклама не инициализируется на главной
        }

        // ══ РЕЖИМ 2: просмотр рекламы за бонус ══
        if (isVbtcMode) {
            show('adWatchSection', true);
            show('backToBonusSection', true);
            el('headerLabel').textContent = 'Шаг 1 — бонус выбран';
            el('coinBalance').textContent = '🎁';
            const badge = el('bonusBadge');
            badge.style.display = 'block';
            badge.textContent = VBTC_BONUS_LABELS[vbtcBonus];
            el('infoCard').innerHTML =
                '<b>' + VBTC_BONUS_LABELS[vbtcBonus] + '</b><br>' +
                'Досмотрите fullscreen-рекламу до конца —<br>кнопка «Забрать бонус» появится автоматически.<br>' +
                '<span style="opacity:0.5;font-size:11px">ver.2.0.0</span>';
            el('backToBonusBtn').addEventListener('click', function() {
                window.location.search = '';
            });
        }

        // ══ РЕЖИМ 3: коины (?coins=1) ══
        if (isCoinsMode) {
            show('coinsSection', true);
            el('headerLabel').textContent = 'Ваши коины';
            let realBalance = 0;
            if (startParam && startParam.startsWith('balance_')) {
                realBalance = parseInt(startParam.replace('balance_', ''), 10) || 0;
            }
            el('coinBalance').textContent = realBalance;
            el('infoCard').innerHTML =
                '<b>5 коинов</b> за клик по рекламе (TGB)<br>' +
                '<b>25 коинов</b> за просмотр Fullscreen рекламы<br>' +
                'Нажмите «Забрать награду» после просмотра.<br>' +
                '<span style="opacity:0.5;font-size:11px">ver.2.0.0</span>';
        }

        function updateCoinBalance() {
            if (!isCoinsMode) return;
            let realBalance = 0;
            if (startParam && startParam.startsWith('balance_')) {
                realBalance = parseInt(startParam.replace('balance_', ''), 10) || 0;
            }
            el('coinBalance').textContent = realBalance + pendingReward;
        }

        function showClaim() {
            show('claimSection', true);
            const btn = el('claimBtn');
            if (isVbtcMode) btn.textContent = '🎁 Забрать бонус: ' + VBTC_BONUS_LABELS[vbtcBonus];
            else btn.textContent = '🪙 Забрать награду (' + pendingReward + ' коинов)';
        }

        // Награда за ПОЛНЫЙ просмотр fullscreen — единственный способ открыть клейм бонуса
        function onFullscreenReward() {
            if (isVbtcMode) {
                adWatched = true;
                toast('✅ Просмотр засчитан!');
                showClaim();
            } else if (isCoinsMode) {
                pendingReward += COIN_PER_FULLSCREEN;
                toast('+' + COIN_PER_FULLSCREEN + ' коинов!');
                updateCoinBalance();
                showClaim();
            }
        }

        // TGB-клик засчитывается ТОЛЬКО в режиме коинов (античит: клик ≠ просмотр)
        function onTgbClick() {
            if (!isCoinsMode) {
                setTxt('tgbStatus', 'Клик засчитан, но для бонуса нужен полный просмотр 🎬');
                return;
            }
            pendingReward += COIN_PER_TGB_CLICK;
            toast('+' + COIN_PER_TGB_CLICK + ' коинов!');
            updateCoinBalance();
            showClaim();
            setTxt('coinsTgbStatus', 'TGB: +' + COIN_PER_TGB_CLICK + ' коинов за клик!');
        }

        function claimRewards() {
            let url;
            if (isVbtcMode) {
                if (!adWatched) return;
                url = 'https://t.me/' + BOT_USERNAME + '?start=vbtc_' + vbtcBonus;
            } else {
                if (pendingReward <= 0) return;
                url = 'https://t.me/' + BOT_USERNAME + '?start=claim_' + pendingReward;
            }
            openTg(url);
            pendingReward = 0; adWatched = false;
            show('claimSection', false);
        }
        el('claimBtn').addEventListener('click', claimRewards);

        // === TGB banner ===
        function initTGB(slotId, statusId) {
            setTxt(statusId, 'TGB: загрузка...');
            // Контейнер с конвенциональным ID создаётся только для активного режима
            const slot = el(slotId);
            if (slot) {
                const c = document.createElement('div');
                c.className = 'tads-container';
                c.id = 'tads-container-' + TGB_WIDGET_ID;
                slot.appendChild(c);
            }
            if (!window.tads || !window.tads.init) { setTxt(statusId, 'TGB: SDK не загружен'); return; }
            try {
                const adController = window.tads.init({
                    widgetId: TGB_WIDGET_ID, type: 'static', debug: false,
                    onClickReward: function() { onTgbClick(); },
                    onAdsNotFound: function(r) { setTxt(statusId, 'TGB: нет рекламы'); }
                });
                adController.loadAd()
                    .then(function() { return adController.showAd(); })
                    .then(function() { setTxt(statusId, 'Реклама загружена'); })
                    .catch(function(e) { setTxt(statusId, 'TGB: ошибка'); });
            } catch(e) { setTxt(statusId, 'TGB: init error'); }
        }

        // === Fullscreen ===
        function initFullscreen(btnId, statusId) {
            const btn = el(btnId);
            if (!btn) return;
            if (!window.tads || !window.tads.init) { setTxt(statusId, 'Fullscreen: SDK не загружен'); return; }
            let adController = null;
            try {
                adController = window.tads.init({
                    widgetId: FULLSCREEN_WIDGET_ID, type: 'fullscreen', debug: false,
                    onShowReward: function() {
                        const ov = el('fullscreen-ad-container');
                        if (ov) ov.classList.remove('active');
                        onFullscreenReward();
                    },
                    onAdsNotFound: function() {
                        const ov = el('fullscreen-ad-container');
                        if (ov) ov.classList.remove('active');
                        setTxt(statusId, 'Fullscreen: нет рекламы, попробуйте позже');
                    }
                });
            } catch(e) { setTxt(statusId, 'Fullscreen: init error'); return; }

            btn.addEventListener('click', function() {
                setTxt(statusId, 'Загрузка рекламы...');
                if (tg) tg.expand();
                const ov = el('fullscreen-ad-container');
                if (ov) ov.classList.add('active');
                if (adController) {
                    adController.loadAd()
                        .then(function() { return adController.showAd(); })
                        .then(function() { setTxt(statusId, 'Смотрите до конца...'); })
                        .catch(function() {
                            if (ov) ov.classList.remove('active');
                            setTxt(statusId, 'Fullscreen: ошибка показа');
                        });
                }
            });
        }

        if (isVbtcMode) {
            initTGB('tgbSlot', 'tgbStatus');
            initFullscreen('fullscreenBtn', 'fullscreenStatus');
        } else if (isCoinsMode) {
            initTGB('coinsTgbSlot', 'coinsTgbStatus');
            initFullscreen('coinsFsBtn', 'coinsFsStatus');
        }

        if (tg) { tg.onEvent('themeChanged', function() {}); }
    })();
    </script>
</body>
</html>
