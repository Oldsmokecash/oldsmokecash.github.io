<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Реклама — коины</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://w.tads.me/widget.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #0f0f0f);
            color: var(--tg-theme-text-color, #fff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }
        .coin-balance {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 8px 0;
        }
        .coin-label {
            font-size: 14px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .ad-section {
            width: 100%;
            max-width: 500px;
            margin: 16px 0;
        }
        .ad-section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            opacity: 0.9;
        }
        .tads-container {
            width: 100%;
            min-height: 120px;
            border-radius: 12px;
            overflow: hidden;
        }
        .btn {
            width: 100%;
            max-width: 500px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin: 8px 0;
        }
        .btn:active { opacity: 0.7; }
        .btn-primary {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
        }
        .btn-reward {
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #000;
        }
        .status-text {
            font-size: 14px;
            opacity: 0.6;
            text-align: center;
            margin: 12px 0;
            min-height: 20px;
        }
        .reward-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #000;
            padding: 24px 40px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: 700;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.4);
            z-index: 9999;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .reward-toast.show {
            transform: translate(-50%, -50%) scale(1);
        }
        .info-card {
            background: var(--tg-theme-secondary-bg-color, #1a1a1a);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 500px;
            margin: 8px 0;
            font-size: 13px;
            line-height: 1.6;
            opacity: 0.8;
        }
        .info-card b { color: #ffd700; }
        #fullscreen-ad-container { display: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="coin-label">Ваши коины</div>
        <div class="coin-balance" id="coinBalance">--</div>
    </div>

    <div class="info-card">
        <b>5 коинов</b> за клик по рекламе (TGB)<br>
        <b>25 коинов</b> за просмотр Fullscreen рекламы<br>
        Нажмите «Забрать коины» после просмотра рекламы.
    </div>

    <!-- TGB Widget -->
    <div class="ad-section">
        <div class="ad-section-title">Реклама — кликни и получи коины</div>
        <div class="tads-container" id="tads-container"></div>
    </div>

    <!-- Fullscreen Widget -->
    <div class="ad-section">
        <button class="btn btn-reward" id="fullscreenBtn">
            🎬 Смотреть рекламу (+25 коинов)
        </button>
    </div>

    <div class="status-text" id="statusText"></div>

    <div id="fullscreen-ad-container"></div>

    <div class="reward-toast" id="rewardToast">+N коинов!</div>

    <!-- Кнопка забрать коины -->
    <div class="ad-section" id="claimSection" style="display:none">
        <button class="btn btn-reward" id="claimBtn">
            🪙 Забрать коины
        </button>
    </div>

    <script>
    (function() {
        // === CONFIG ===
        const TGB_WIDGET_ID = 11464;                     // TGB баннер
        const FULLSCREEN_WIDGET_ID = 11466;               // Fullscreen реклама
        const BOT_USERNAME = 'MusorkaBMB_bot';             // username бота (без @)
        const COIN_PER_TGB_CLICK = 5;
        const COIN_PER_FULLSCREEN = 25;

        // === Telegram WebApp init ===
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const user = tg ? tg.initDataUnsafe : null;
        const telegramId = user ? String(user.id) : null;
        const startParam = user ? (user.start_param || '') : '';

        // === UI helpers ===
        function showStatus(msg) {
            const el = document.getElementById('statusText');
            if (el) el.textContent = msg;
        }

        function showRewardToast(amount) {
            const toast = document.getElementById('rewardToast');
            toast.textContent = '+' + amount + ' коинов!';
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 2000);
        }

        // Накопленные коины (в localStorage)
        let pendingReward = 0;

        function updateBalance() {
            let cached = parseInt(localStorage.getItem('user_coins') || '0', 10);
            document.getElementById('coinBalance').textContent = cached + pendingReward;
        }

        // Добавить награду и показать кнопку «Забрать»
        function addReward(amount, type) {
            pendingReward += amount;
            showRewardToast(amount);
            updateBalance();
            // Показать кнопку «Забрать коины»
            const claimSection = document.getElementById('claimSection');
            if (claimSection) claimSection.style.display = 'block';
            const claimBtn = document.getElementById('claimBtn');
            if (claimBtn) claimBtn.textContent = '🪙 Забрать ' + pendingReward + ' коинов';
        }

        // Отправить награду боту через Telegram deep linking
        function claimRewards() {
            if (pendingReward <= 0) return;
            if (!BOT_USERNAME) {
                showStatus('Не настроен username бота!');
                return;
            }
            // Сохраняем в localStorage
            let cached = parseInt(localStorage.getItem('user_coins') || '0', 10);
            cached += pendingReward;
            localStorage.setItem('user_coins', String(cached));
            // Открываем чат с ботом с параметром claim_N
            const url = 'https://t.me/' + BOT_USERNAME + '?start=claim_' + pendingReward;
            if (tg) {
                tg.openTelegramLink(url);
            } else {
                window.open(url, '_blank');
            }
            pendingReward = 0;
            const claimSection = document.getElementById('claimSection');
            if (claimSection) claimSection.style.display = 'none';
        }

        // === TGB Widget (Text-Graphic Block) ===
        function initTGB() {
            if (!TGB_WIDGET_ID) {
                showStatus('TGB widget ID не настроен');
                return;
            }

            const adsNotFoundCallback = function() {
                showStatus('Реклама недоступна, попробуйте позже');
            };

            const onClickRewardCallback = function(adId) {
                addReward(COIN_PER_TGB_CLICK, 'tgb_click');
                showStatus('+' + COIN_PER_TGB_CLICK + ' коинов за клик! Нажмите «Забрать коины»');
            };

            try {
                const adController = window.tads.init({
                    widgetId: TGB_WIDGET_ID,
                    type: 'static',
                    debug: true,
                    onClickReward: onClickRewardCallback,
                    onAdsNotFound: adsNotFoundCallback
                });

                adController.loadAd()
                    .then(function() { return adController.showAd(); })
                    .then(function() { showStatus('Реклама загружена — кликните для награды'); })
                    .catch(function(err) {
                        console.log('TGB error:', err);
                        adsNotFoundCallback();
                    });
            } catch(e) {
                console.log('TGB init error:', e);
                showStatus('Ошибка загрузки рекламы');
            }
        }

        // === Fullscreen Widget ===
        function initFullscreen() {
            if (!FULLSCREEN_WIDGET_ID) {
                showStatus('Fullscreen widget ID не настроен');
                return;
            }

            const btn = document.getElementById('fullscreenBtn');
            if (!btn) return;

            const onShowRewardCallback = function(result) {
                addReward(COIN_PER_FULLSCREEN, 'fullscreen_view');
                showStatus('+' + COIN_PER_FULLSCREEN + ' коинов за просмотр! Нажмите «Забрать коины»');
            };

            const onAdsNotFound = function() {
                showStatus('Реклама недоступна, попробуйте позже');
            };

            let adController = null;

            try {
                adController = window.tads.init({
                    widgetId: FULLSCREEN_WIDGET_ID,
                    type: 'fullscreen',
                    debug: false,
                    onShowReward: onShowRewardCallback,
                    onAdsNotFound: onAdsNotFound
                });
            } catch(e) {
                console.log('Fullscreen init error:', e);
                showStatus('Ошибка инициализации Fullscreen');
                return;
            }

            btn.addEventListener('click', function() {
                showStatus('Загрузка рекламы...');
                if (adController) {
                    adController.loadAd()
                        .then(function() { return adController.showAd(); })
                        .catch(function(result) {
                            console.log('Fullscreen show error:', result);
                            onAdsNotFound();
                        });
                }
            });
        }

        // === Кнопка «Забрать коины» ===
        const claimBtn = document.getElementById('claimBtn');
        if (claimBtn) {
            claimBtn.addEventListener('click', claimRewards);
        }

        // === Init ===
        updateBalance();
        initTGB();
        initFullscreen();

        // Listen for Telegram theme changes
        if (tg) {
            tg.onEvent('themeChanged', function() {
                // Theme is applied via CSS variables automatically
            });
        }
    })();
    </script>
</body>
</html>
