<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Реклама — коины</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://w.tads.me/widget.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #0f0f0f);
            color: var(--tg-theme-text-color, #fff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            width: 100%;
        }
        .coin-balance {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 8px 0;
        }
        .coin-label {
            font-size: 14px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .ad-section {
            width: 100%;
            max-width: 500px;
            margin: 16px 0;
        }
        .ad-section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            opacity: 0.9;
        }
        .tads-container {
            width: 100%;
            min-height: 120px;
            border-radius: 12px;
            overflow: hidden;
        }
        .btn {
            width: 100%;
            max-width: 500px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin: 8px 0;
        }
        .btn:active { opacity: 0.7; }
        .btn-primary {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
        }
        .btn-reward {
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #000;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(255, 215, 0, 0.3);
        }
        .btn-claim {
            background: linear-gradient(135deg, #00e676, #00c853);
            color: #000;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(0, 230, 118, 0.3);
        }
        .status-text {
            font-size: 14px;
            opacity: 0.6;
            text-align: center;
            margin: 12px 0;
            min-height: 20px;
        }
        .reward-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #000;
            padding: 24px 40px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: 700;
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.4);
            z-index: 9999;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .reward-toast.show {
            transform: translate(-50%, -50%) scale(1);
        }
        .info-card {
            background: var(--tg-theme-secondary-bg-color, #1a1a1a);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 500px;
            margin: 8px 0;
            font-size: 13px;
            line-height: 1.6;
            opacity: 0.8;
        }
        .info-card b { color: #ffd700; }

        /* TADS Fullscreen overlay */
        .tads-fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            z-index: 10000;
            display: none;
            background: #000;
        }
        .tads-fullscreen-overlay.active { display: flex; align-items: center; justify-content: center; }
        .tads-fullscreen-overlay iframe,
        .tads-fullscreen-overlay div,
        .tads-fullscreen-overlay img {
            max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain;
        }

        /* TGB container auto-fit */
        .tads-container { min-height: 100px; }
        .tads-container > * { width: 100% !important; max-width: 100% !important; }
        .tads-container img { max-width: 100% !important; height: auto !important; border-radius: 8px; }
        .tads-container iframe { width: 100% !important; max-width: 100% !important; border: none; }
    </style>
</head>
<body>
    <div class="header">
        <div class="coin-label">Ваши коины</div>
        <div class="coin-balance" id="coinBalance">--</div>
    </div>

    <div class="info-card">
        <b>5 коинов</b> за клик по рекламе (TGB)<br>
        <b>25 коинов</b> за просмотр Fullscreen рекламы<br>
        Нажмите «Забрать коины» после просмотра рекламы.
    </div>

    <!-- TGB Widget -->
    <div class="ad-section">
        <div class="ad-section-title">📺 Реклама — кликни и получи коины</div>
        <div class="tads-container" id="tads-container-11464"></div>
        <div class="status-text" id="tgbStatus"></div>
    </div>

    <!-- Fullscreen Widget -->
    <div class="ad-section">
        <button class="btn btn-reward" id="fullscreenBtn">
            🎬 Смотреть рекламу (+25 коинов)
        </button>
        <div class="status-text" id="fullscreenStatus"></div>
    </div>

    <div class="tads-fullscreen-overlay" id="fullscreen-ad-container"></div>

    <div class="reward-toast" id="rewardToast">+N коинов!</div>

    <!-- Кнопка забрать коины -->
    <div class="ad-section" id="claimSection" style="display:none">
        <button class="btn btn-claim" id="claimBtn">
            🪙 Забрать награду
        </button>
    </div>

    <script>
    (function() {
        // === CONFIG ===
        const TGB_WIDGET_ID = 11464;                     // TGB баннер
        const FULLSCREEN_WIDGET_ID = 11466;               // Fullscreen реклама
        const BOT_USERNAME = 'MusorkaBMB_bot';             // username бота (без @)
        const COIN_PER_TGB_CLICK = 5;
        const COIN_PER_FULLSCREEN = 25;

        // === Telegram WebApp init ===
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.ready();
            tg.expand();
            tg.setBackgroundColor && tg.setBackgroundColor('#0f0f0f');
        }

        const user = tg ? tg.initDataUnsafe : null;
        const telegramId = user ? String(user.id) : null;
        // start_param может быть 'balance_N' или 'claim_N'
        const startParam = user ? (user.start_param || '') : '';

        // === UI helpers ===
        function showStatus(msg) {
            const el = document.getElementById('tgbStatus');
            if (el) el.textContent = msg;
        }

        function showTgbStatus(msg) {
            const el = document.getElementById('tgbStatus');
            if (el) el.textContent = msg;
        }

        function showFullscreenStatus(msg) {
            const el = document.getElementById('fullscreenStatus');
            if (el) el.textContent = msg;
        }

        function showRewardToast(amount) {
            const toast = document.getElementById('rewardToast');
            toast.textContent = '+' + amount + ' коинов!';
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 2000);
        }

        // Накопленные коины (в localStorage — только для UI, реальный баланс в боте)
        let pendingReward = 0;

        function updateBalance() {
            // Реальный баланс передаётся через start_param (если бот открыл Web App с параметром)
            let realBalance = 0;
            if (startParam && startParam.startsWith('balance_')) {
                realBalance = parseInt(startParam.replace('balance_', ''), 10) || 0;
            }
            document.getElementById('coinBalance').textContent = realBalance + pendingReward;
        }

        // Добавить награду и показать кнопку «Забрать»
        function addReward(amount, type) {
            pendingReward += amount;
            showRewardToast(amount);
            updateBalance();
            // Показать кнопку «Забрать коины»
            const claimSection = document.getElementById('claimSection');
            if (claimSection) claimSection.style.display = 'block';
            const claimBtn = document.getElementById('claimBtn');
            if (claimBtn) claimBtn.textContent = '🪙 Забрать награду (' + pendingReward + ' коинов)';
        }

        // Отправить награду боту через Telegram deep linking
        function claimRewards() {
            if (pendingReward <= 0) return;
            if (!BOT_USERNAME) {
                showStatus('Не настроен username бота!');
                return;
            }
            // Открываем чат с ботом с параметром claim_N — бот начислит коины в user_coins.json
            const url = 'https://t.me/' + BOT_USERNAME + '?start=claim_' + pendingReward;
            if (tg) {
                tg.openTelegramLink(url);
            } else {
                window.open(url, '_blank');
            }
            pendingReward = 0;
            const claimSection = document.getElementById('claimSection');
            if (claimSection) claimSection.style.display = 'none';
            updateBalance();
        }

        // === TGB Widget (Text-Graphic Block) ===
        function initTGB() {
            showTgbStatus('TGB: инициализация...');
            console.log('[TGB] window.tads:', typeof window.tads);
            console.log('[TGB] window.tads.init:', window.tads ? typeof window.tads.init : 'N/A');

            if (!window.tads || !window.tads.init) {
                showTgbStatus('TGB: SDK не загружен! Проверьте https://w.tads.me/widget.js');
                console.error('[TGB] TADS SDK не найден!');
                return;
            }
            if (!TGB_WIDGET_ID) {
                showTgbStatus('TGB: widget ID не настроен');
                return;
            }

            const adsNotFoundCallback = function(reason) {
                console.log('[TGB] onAdsNotFound:', reason);
                showTgbStatus('TGB: нет рекламы. Ответ: ' + JSON.stringify(reason));
            };

            const onClickRewardCallback = function(adId) {
                console.log('[TGB] onClickReward:', adId);
                addReward(COIN_PER_TGB_CLICK, 'tgb_click');
                showTgbStatus('TGB: +' + COIN_PER_TGB_CLICK + ' коинов за клик!');
            };

            try {
                console.log('[TGB] init with widgetId:', TGB_WIDGET_ID, 'type: static');
                const adController = window.tads.init({
                    widgetId: TGB_WIDGET_ID,
                    type: 'static',
                    debug: false,
                    onClickReward: onClickRewardCallback,
                    onAdsNotFound: adsNotFoundCallback
                });
                console.log('[TGB] adController:', adController);

                adController.loadAd()
                    .then(function(res) { console.log('[TGB] loadAd OK:', res); return adController.showAd(); })
                    .then(function(res) { console.log('[TGB] showAd OK:', res); showTgbStatus('TGB: реклама загружена — кликните для награды'); })
                    .catch(function(err) {
                        console.log('[TGB] error:', err);
                        showTgbStatus('TGB: ошибка: ' + JSON.stringify(err));
                    });
            } catch(e) {
                console.log('[TGB] init error:', e);
                showTgbStatus('TGB: init error: ' + e.message);
            }
        }

        // === Fullscreen Widget ===
        function initFullscreen() {
            console.log('[FS] window.tads:', typeof window.tads);
            if (!window.tads || !window.tads.init) {
                showFullscreenStatus('Fullscreen: SDK не загружен!');
                return;
            }
            if (!FULLSCREEN_WIDGET_ID) {
                showFullscreenStatus('Fullscreen: widget ID не настроен');
                return;
            }

            const btn = document.getElementById('fullscreenBtn');
            if (!btn) return;

            const onShowRewardCallback = function(result) {
                console.log('[FS] onShowReward:', result);
                var overlay = document.getElementById('fullscreen-ad-container');
                if (overlay) overlay.classList.remove('active');
                addReward(COIN_PER_FULLSCREEN, 'fullscreen_view');
                showFullscreenStatus('Fullscreen: +' + COIN_PER_FULLSCREEN + ' коинов за просмотр!');
            };

            const onAdsNotFound = function(reason) {
                console.log('[FS] onAdsNotFound:', reason);
                var overlay = document.getElementById('fullscreen-ad-container');
                if (overlay) overlay.classList.remove('active');
                showFullscreenStatus('Fullscreen: нет рекламы. Ответ: ' + JSON.stringify(reason));
            };

            let adController = null;

            try {
                console.log('[FS] init with widgetId:', FULLSCREEN_WIDGET_ID, 'type: fullscreen');
                adController = window.tads.init({
                  widgetId: FULLSCREEN_WIDGET_ID,
                  type: 'fullscreen',
                  debug: false,
                    onShowReward: onShowRewardCallback,
                    onAdsNotFound: onAdsNotFound
                });
                console.log('[FS] adController:', adController);
            } catch(e) {
                console.log('[FS] init error:', e);
                showFullscreenStatus('Fullscreen: init error: ' + e.message);
                return;
            }

            btn.addEventListener('click', function() {
                showFullscreenStatus('Fullscreen: загрузка рекламы...');
                // Раскрыть Web App на весь экран перед показом рекламы
                if (tg) { tg.expand(); }
                // Показать overlay
                var overlay = document.getElementById('fullscreen-ad-container');
                if (overlay) overlay.classList.add('active');

                if (adController) {
                    adController.loadAd()
                        .then(function(res) { console.log('[FS] loadAd result:', res); return adController.showAd(); })
                        .then(function(res) { console.log('[FS] showAd result:', res); showFullscreenStatus('Fullscreen: реклама показывается...'); })
                        .catch(function(result) {
                            console.log('[FS] show error:', result);
                            if (overlay) overlay.classList.remove('active');
                            showFullscreenStatus('Fullscreen: ошибка: ' + JSON.stringify(result));
                        });
                }
            });
        }

        // === Кнопка «Забрать коины» ===
        const claimBtn = document.getElementById('claimBtn');
        if (claimBtn) {
            claimBtn.addEventListener('click', claimRewards);
        }

        // === Init ===
        updateBalance();
        initTGB();
        initFullscreen();

        // Listen for Telegram theme changes
        if (tg) {
            tg.onEvent('themeChanged', function() {
                // Theme is applied via CSS variables automatically
            });
        }
    })();
    </script>
</body>
</html>
